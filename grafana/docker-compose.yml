networks:
  observe:

services:
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: prometheus
    volumes:
      - ./data/prometheus:/prometheus/data
      - ./config/prometheus.yml:/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    command:
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-remote-write-receiver'
    restart: always
    networks:
      - observe

  grafana:
    image: grafana/grafana-oss:11.6.1-ubuntu
    container_name: grafana
    depends_on:
      - prometheus
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/dashboards:/var/lib/grafana/dashboards
      - ./config/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./config/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - '3000:3000'
    restart: always
    networks:
      - observe
