apiVersion: 1

deleteDatasources:
  - name: prometheus

datasources:
  - name: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: GET
      keepCookies: []
      timeInterval: 10s
    version: 1
    editable: false
